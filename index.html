<title>Prüfungstrainer G-Niveau</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Layout: schmaler Prüfungsbogen, oben fester Zeitbalken; Ablauf Start → Teil 1 → Pause → Teil 2 → Auswertung */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#e9f0fa; --ink:#12233d; --muted:#51627c; --line:#cfd9e8;
  --blue:#1d5fb0; --blue-d:#0f3a70; --blue-t:#dce9fa; --orange:#f58a1f; --orange-t:#fff0de; --orange-ink:#9a4300;
  --sol-bg:#fff5e8; --sol-ink:#b3300a; --ok:#1c8a4f; --ok-t:#dff3e7; --bad:#c0392b; --bad-t:#fde7e4; --warn:#b36b00;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1627; --surface:#14233b; --surface2:#1a2d4a; --ink:#e8eff9; --muted:#9db0cb; --line:#2a4064;
  --blue:#6aaaf0; --blue-d:#0a2342; --blue-t:#1c3558; --orange:#ffa047; --orange-t:#3a2a17; --orange-ink:#ffb978;
  --sol-bg:#2c2216; --sol-ink:#ff9a7a; --ok:#58d08e; --ok-t:#12301f; --bad:#ff8b7b; --bad-t:#3a1a16; --warn:#ffc15a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1627; --surface:#14233b; --surface2:#1a2d4a; --ink:#e8eff9; --muted:#9db0cb; --line:#2a4064;
  --blue:#6aaaf0; --blue-d:#0a2342; --blue-t:#1c3558; --orange:#ffa047; --orange-t:#3a2a17; --orange-ink:#ffb978;
  --sol-bg:#2c2216; --sol-ink:#ff9a7a; --ok:#58d08e; --ok-t:#12301f; --bad:#ff8b7b; --bad-t:#3a1a16; --warn:#ffc15a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{background:var(--blue-d);color:#fff;border-bottom:5px solid var(--orange)}
.top-in{max-width:900px;margin:0 auto;padding:16px 16px 14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:end;justify-content:space-between}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.2vw,2.3rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top h1 em{font-style:normal;color:var(--orange)}
.top p{margin:6px 0 0;color:#c7d9f2;font-size:.93rem;max-width:52ch}
.theme{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line);box-shadow:0 4px 14px rgba(15,58,112,.08)}
.bar-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar .lbl{font-family:var(--display);font-weight:800;font-size:1.02rem;flex:1 1 12rem;min-width:0}
.bar .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.78rem;color:var(--muted)}
.clock{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;background:var(--blue-t);color:var(--blue-d);border-radius:12px;padding:7px 14px;min-width:6.4rem;text-align:center}
:root[data-theme="dark"] .clock{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clock{color:var(--ink)}}
.clock.warn{background:var(--orange-t);color:var(--orange-ink)}
.clock.danger{background:var(--bad-t);color:var(--bad)}
.clock.hide{letter-spacing:.2em}
.chips{max-width:900px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--blue-t);border-color:var(--blue)}
.btn{border:2px solid var(--blue);background:var(--surface);color:var(--blue);border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;font-family:var(--display)}
.btn:hover{background:var(--blue-t)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#1b1100}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 11px;font-size:.88rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:default}
main{max-width:900px;margin:0 auto;padding:18px 16px 70px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px clamp(16px,3vw,30px) 24px;min-width:0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.4vw,1.8rem);margin:0 0 6px;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0 0 8px}
.muted{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 4px}
.fact{background:var(--blue-t);border-radius:10px;padding:10px 14px}
.fact b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--blue);line-height:1.1}
:root[data-theme="dark"] .fact b{color:var(--ink)}
.fact span{font-size:.9rem;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pick{background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--orange)}
.pick .n{font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--orange);line-height:1}
.pick b{font-family:var(--display);font-size:1.15rem}
.pick small{color:var(--muted)}
.pick .last{font-weight:800;color:var(--blue);font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:14px}
.opts label{display:flex;gap:8px;align-items:center;font-weight:700}
.opts select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange)}
.banner{border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.nocalc{background:var(--orange-t);color:var(--orange-ink);border:1px solid var(--orange)}
.banner.calc{background:var(--ok-t);color:var(--ok);border:1px solid var(--ok)}
.banner.time{background:var(--bad-t);color:var(--bad);border:1px solid var(--bad)}
.task{scroll-margin-top:150px}
.task>h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.task .pt{font-size:.78rem;font-weight:800;background:var(--orange);color:#1b1100;border-radius:99px;padding:2px 10px;font-family:var(--body)}
.intro{margin:0 0 10px}
.intro p{margin:0 0 8px}
.part{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}
.part .q{display:flex;gap:10px}
.part .q>b,.rpart .q>b{flex:none}
.rpart .q{display:flex;gap:10px}
.rpart .q .txt{min-width:0}
.rpart .q p{margin:0 0 6px}
.part .q .txt{min-width:0}
.part .q p{margin:0 0 6px}
.part .q ul{margin:4px 0 6px;padding-left:1.3rem}
.ppt{font-style:italic;color:var(--muted);white-space:nowrap}
.mc{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mc label{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.mc label:hover{border-color:var(--blue)}
.mc input{accent-color:var(--orange);width:18px;height:18px}
.mc input:checked+span{font-weight:800}
.mc label:has(input:checked){border-color:var(--orange);background:var(--orange-t)}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px}
.field{display:flex;gap:6px;align-items:center}
.field input{width:9rem;max-width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--orange);outline:none}
.paper{font-size:.88rem;color:var(--muted)}
.rec{display:inline-block;align-self:flex-start;width:fit-content;margin-top:6px;padding:2px 10px;border-radius:99px;background:var(--orange);color:#1b1000;font-weight:800;font-size:.8rem}
.selfhint{display:block;margin-top:6px;padding:8px 12px;border-radius:8px;background:var(--orange-t);border-left:4px solid var(--orange);color:var(--orange-ink);font-weight:800}
.hint{font-size:.9rem;color:var(--muted);font-style:italic}
img.fig{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin:8px 0}
table.tab{border-collapse:collapse;margin:8px 0;max-width:100%}
.tw{overflow-x:auto}
table.tab th,table.tab td{border:1px solid var(--line);padding:5px 11px;text-align:center}
table.tab th{background:var(--blue-t);color:var(--ink)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choose button{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choose button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-t)}
.choose b{font-family:var(--display)}
.choose small{color:var(--muted)}
.endbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:14px;padding:14px 18px}
.big-clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--blue);margin:8px 0}
:root[data-theme="dark"] .big-clock{color:var(--ink)}
.todo{margin:8px 0 0;padding-left:1.2rem}
.todo li{margin:3px 0}
/* Auswertung */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.sbox{background:var(--blue-t);border-radius:12px;padding:12px 14px}
.sbox small{display:block;color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.sbox span{display:block}
.sbox b{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sbox.main{background:var(--orange-t)}
.band{font-weight:800}
.tbars{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.tb{display:grid;grid-template-columns:minmax(8rem,16rem) minmax(0,1fr) 5.5rem;gap:10px;align-items:center;font-size:.95rem}
.tb .nm{font-weight:700;line-height:1.25}
.tb .tr{height:14px;background:var(--surface2);border-radius:8px;overflow:hidden}
.tb .tr i{display:block;height:100%;border-radius:8px}
.tb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.g-low i{background:var(--bad)}.g-mid i{background:var(--orange)}.g-hi i{background:var(--ok)}
@media (max-width:560px){.tb{grid-template-columns:minmax(0,1fr) 5rem}.tb .tr{grid-column:1/-1;order:3}}
.tips{display:flex;flex-direction:column;gap:12px}
.tip{border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:0 12px 12px 0;padding:10px 16px;background:var(--surface)}
.tip h4{margin:0 0 4px;font-family:var(--display);font-size:1.05rem}
.tip ul{margin:4px 0 0;padding-left:1.2rem}
.tip li{margin:3px 0}
.rev{border-top:2px solid var(--line);padding-top:14px;margin-top:6px}
.rpart{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.res{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.pill{border-radius:99px;padding:2px 10px;font-weight:800;font-size:.8rem}
.pill.ok{background:var(--ok-t);color:var(--ok)}.pill.bad{background:var(--bad-t);color:var(--bad)}.pill.self{background:var(--orange-t);color:var(--orange-ink)}
.mc.rv label{cursor:default}
.mc.rv label.right{border-color:var(--ok);background:var(--ok-t)}
.mc.rv label.wrong{border-color:var(--bad);background:var(--bad-t)}
.rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rate button{min-width:2.3rem;border:2px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 9px;font-weight:800;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1b1100}
.rate.need button{border-color:var(--orange)}
details.sol{border:2px solid var(--orange);border-radius:12px;background:var(--sol-bg)}
details.sol summary{cursor:pointer;font-weight:800;padding:8px 14px;color:var(--orange-ink);font-family:var(--display)}
details.sol .in{padding:0 14px 10px}
details.sol .in p{margin:6px 0}
.ans{font-weight:800;color:var(--sol-ink)}
.red{color:var(--sol-ink)}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.nkey{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.nkey span{flex:1 1 70px;border:1px solid var(--line,#ccc);border-radius:8px;padding:6px 8px;text-align:center;font-size:.85rem}.nkey b{display:block;font-size:1.1rem}.nkey .on{background:var(--blue-d);color:#fff;border-color:transparent}
</style>
<header class="top"><div class="top-in">
  <div><h1>Prüfungs<em>trainer</em> G-Niveau</h1><p>Drei komplette Abschlussprüfungen Mathematik zum Üben, mit Timer, Pause und Selbstbewertung zwischen Teil 1 und Teil 2 und einer Auswertung mit Übungshinweisen.</p></div>
  <button class="theme" id="th" aria-label="Hell oder dunkel umschalten">◐ Hell/Dunkel</button>
</div></header>
<div id="barwrap"></div>
<main id="app"></main>
<div class="sr" id="live" aria-live="polite"></div>

r Strecke in km.","sol":"7,5 cm · 200&nbsp;000 = 1&nbsp;500&nbsp;000 cm = 15&nbsp;000 m = 15 km.<p class=\"ans\">Die Strecke ist in Wirklichkeit 15 km lang.<\/p>","fields":[{"label":"Länge =","unit":"km","answer":"15","tol":0,"alt":["15"]}]}]}]},"teil2":{"pflicht":[{"id":"1","titel":"Schulkiosk","themaA":"Stochastik: Wahrscheinlichkeit und Zufall","intro":"<p>Am Schulkiosk wird in der Pause ein Karton mit 40 verpackten Müsliriegeln verkauft. Die Riegel unterscheiden sich nur in der Sorte:<\/p><ul><li>16 Schoko-Riegel (S),<\/li><li>12 Nuss-Riegel (N),<\/li><li>8 Apfel-Riegel (A),<\/li><li>4 Kokos-Riegel (K).<\/li><\/ul><p>Ein Kind greift blind in den Karton und nimmt zufällig einen Riegel.<\/p>","parts":[{"id":"a","pts":2,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"num","q":"Gib die Wahrscheinlichkeit dafür an, dass es ein Nuss-Riegel ist. Gib sie als Dezimalzahl und als Prozentzahl an.","sol":"P(N) = {12/40} = {3/10} = 30 %.<p class=\"ans\">P(N) = {3/10} = 30 %<\/p>","fields":[{"label":"Dezimalzahl =","unit":"","answer":"0,3","tol":0,"alt":["0.3","3/10"]},{"label":"Prozent =","unit":"%","answer":"30","tol":0,"alt":["30"]}]},{"id":"b","pts":3,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"num","q":"Berechne die Wahrscheinlichkeit dafür, dass es kein Schoko-Riegel ist. Gib sie in Prozent an.","sol":"<p>1 P: Gegenereignis: Schoko-Riegel mit P(S) = {16/40} = 40 %.<\/p><p>2 P: P(nicht S) = 1 − {16/40} = {24/40} = {3/5} = 60 %. (Kontrolle: 12 + 8 + 4 = 24 Riegel.)<\/p><p class=\"ans\">P(nicht S) = {3/5} = 60 %<\/p>","fields":[{"label":"Prozent =","unit":"%","answer":"60","tol":0,"alt":["60"]}]},{"id":"c","pts":4,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"num","q":"Nun werden nacheinander zwei Riegel genommen, ohne dass der erste zurückgelegt wird.<br>Berechne die Wahrscheinlichkeit für das Ereignis: „Erst wird ein Apfel-Riegel und dann ein Kokos-Riegel genommen“. Gib sie in Prozent an (gerundet auf eine Nachkommastelle).","sol":"<p>1 P: Pfad A – K.<\/p><p>1 P: P(A im 1. Zug) = {8/40}.<\/p><p>1 P: P(K im 2. Zug) = {4/39}, da nur noch 39 Riegel im Karton sind.<\/p><p>1 P: Pfadregel: {8/40} · {4/39} = {32/1560} = {4/195} ≈ 0,0205.<\/p><p class=\"ans\">P ≈ 2,1 %<\/p>","fields":[{"label":"Prozent =","unit":"%","answer":"2,1","tol":0.05,"alt":["2.1","2,05","2.05"]}]},{"id":"d","pts":4,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"num","q":"Berechne die Wahrscheinlichkeit für das Ereignis: „Es werden zwei Schoko-Riegel oder zwei Nuss-Riegel genommen“ (wieder ohne Zurücklegen). Gib sie in Prozent an (gerundet auf eine Nachkommastelle).","sol":"<p>2 Pfade: S – S und N – N (1 P).<\/p><p>P(S, S) = {16/40} · {15/39} = {240/1560} (1 P)<\/p><p>P(N, N) = {12/40} · {11/39} = {132/1560} (1 P)<\/p><p>Summe: {372/1560} = {31/130} ≈ 0,2385 (1 P).<\/p><p class=\"ans\">P ≈ 23,8 %<\/p>","fields":[{"label":"Prozent =","unit":"%","answer":"23,8","tol":0.05,"alt":["23.8","23,85","23.85"]}]},{"id":"e","pts":3,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Jetzt werden nicht mehr Wahrscheinlichkeiten betrachtet, sondern mögliche Kombinationen. Es werden zwei Riegel aus dem Karton genommen. Die Reihenfolge wird nicht beachtet. Eine mögliche Kombination wäre SS (zwei Schoko-Riegel).<br>Schreibe alle 10 Kombinationen auf.","sol":"<p>Alle 10 Kombinationen:<\/p><p class=\"ans\">SS, SN, SA, SK, NN, NA, NK, AA, AK, KK<\/p><p>3 P für alle 10 Kombinationen ohne Doppelungen; 2 P bei 8 oder 9 richtigen; 1 P bei 5 bis 7 richtigen. (SN und NS zählen als dieselbe Kombination.)<\/p>"}]},{"id":"2","titel":"Fahrradtour","themaA":"Funktionale Zusammenhänge","intro":"<p>Tom plant eine Fahrradtour mit einer Länge von 48 km. Er fährt gleichmäßig 12 km pro Stunde.<\/p><p>Die Funktion f mit f(x) = −12x + 48 beschreibt die Strecke (in km), die Tom noch fahren muss. x gibt an, wie viele Stunden Tom schon gefahren ist.<\/p><p>Das bedeutet beispielsweise: Nach 2 Stunden muss Tom noch 24 km fahren. Auf dem Graphen der Funktion f ist das der Punkt P(2 | 24).<\/p>","parts":[{"id":"a","pts":3,"topic":"Funktionale Zusammenhänge","type":"self","q":"Zeichne den Punkt P und den Graphen der Funktion f in das Koordinatensystem ein.<br><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAn8AAAIYCAYAAAAcv4oZAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAV9FJREFUeJzt3Xt8z/X///H7TjbMNoxhcz6f5Uw5RjlVRIxWUoiP8pFS6qsifaIkSkkKEUU5LBLKOckx5/N5NgwbNsaOr98f2ftn7WDl/dp7e79u18tlly57PZ+v1+ux92PVfa+ji2EYhgAAAGAJro4uAAAAADmH8AcAAGAhhD8AAAALIfwBAABYCOEPAADAQgh/AAAAFkL4AwAAsBDCHwAAgIUQ/gAAACyE8AcAAGAhhD8AAAALcXd0Ac4sIiJC586ds33fuXNnubq66sKFCw6sCgAAWBnhz0RffvmlxowZk2aZh4eHTp486aCKAABAXlOhQgW7bs/FMAzDrluEzd+P/LVp00ZJSUm6fv26A6uyr+TkZEVERCgwMFBubm6OLscu5s+fL0kKDg52cCX242x9okd5g7P1iR7lDc7Wp/nz5yskJMSu2+TIn4kCAwMVGBho+97V1VUuLi5yd3e+j93Nzc1pfq7ExERJcpqf507O0id6lDc4a5/oUd7gLH1K7ZE9ccMHAACAhRD+AAAALITwBwAAYCGEPwAAAAsh/AEAAFgI4Q8AAMBCCH8AAAAWQvgDAACwEMIfAACAhRD+AAAALITwBwAAYCGEPwAAAAsh/AEAAFgI4Q8AAMBCCH8AAAAWQvgDAACwEMIfAACAhRD+AAAALITwBwAAYCGEPwAAAAsh/AEAAFgI4Q8AAMBCCH8AAAAWQvgDAACwEMIfAACAhRD+AAAALITwBwAAYCGEPwAAAAsh/AEAAFgI4Q8AAMBCCH9/k5ycrLi4OEeXAQAAYAqnC3+DBg1S5cqVM/2aOnVqhutt2bJFLVq0kKenpwoWLKiyZctqwoQJOVw9AACAuZwu/G3btk3Hjx+XYRjZXmfFihV68MEHtWnTJlWtWlVt27ZVZGSkXn31VQ0cOFDJyckmVgwAAJBz3B1dgL2dOXNGfn5+On78eLbmX716VU888YQSEhK0dOlSPfLII5Kky5cvq2XLlvryyy/VuHFj9e/f38yyAQAAcoRTHfm7ceOGoqOjVaZMmWyvM2PGDN24cUMjR460BT9J8vf3V2hoqCRpypQp9i4VAADAIVyMf3J+NJc7ePCgatasqS5dumjZsmXZWqdGjRo6dOiQjh49qsqVK6cbb968uf744w9t27ZNjRo1uuv2fHx8Mh2LjY2Vl5dXptcd5lUpKSlydXWevyMSExMlSR4eHg6uxL6cqU/0KG9wxj7Ro7zBmfqUmJiogQMH2nWbzvHJ3HbmzBlJUpkyZXTy5EnNnDlTEyZM0C+//KLr16+nm5+SkqJjx46pXLlyGQY/SXrooYckSUePHjWvcAAAgBziVNf8pYa/lStXavr06UpKSrKNBQUFadasWWrXrp1tWWRkpJKSklSyZMlMt5k6dvbs2WzVEBMTk+mYj4+PEhMT1a9fv2xtKy9ISkpSWFiYypQpI3d35/h1mjVrliTRp1yMHuUNztYnepQ3OFufUntkT0515C8hIUFFixZVYmKixo4dq1WrVmnJkiUKCQlReHi4OnbsqH379tnmh4eHS5KKFy+e6TYDAgLSzAUAAMjL8n4kv ss=\"fig\"><\/p>"},{"id":"b","pts":3,"topic":"Funktionale Zusammenhänge","type":"num","q":"Tom ist 2,5 Stunden gefahren. Bestimme die Strecke, die er noch fahren muss.","sol":"<p>1 P: x = 2,5 in f einsetzen.<\/p><p>2 P: f(2,5) = −12 · 2,5 + 48 = −30 + 48 = 18.<\/p><p class=\"ans\">Tom muss noch 18 km fahren.<\/p>","fields":[{"label":"Reststrecke =","unit":"km","answer":"18","tol":0,"alt":["18"]}]},{"id":"c","pts":4,"topic":"Funktionale Zusammenhänge","type":"num","q":"<ul><li>Bestimme die Fahrzeit in Stunden, die Tom für die gesamte Tour benötigt.<\/li><li>Gib auch die Anzahl der Tage an, die Tom für die gesamte Tour benötigt, wenn er pro Tag höchstens 3 Stunden fährt.<\/li><\/ul>","sol":"<p>2 P: Die Tour ist zu Ende, wenn f(x) = 0 gilt: −12x + 48 = 0, also x = 4. (Oder: 48 km : 12 km/h = 4 h.)<\/p><p>2 P: 4 h : 3 h pro Tag ≈ 1,33, also sind 2 Tage nötig.<\/p><p class=\"ans\">Fahrzeit: 4 Stunden; Anzahl der Tage: 2<\/p>","fields":[{"label":"Fahrzeit =","unit":"h","answer":"4","tol":0,"alt":["4"]},{"label":"Tage =","unit":"","answer":"2","tol":0,"alt":["2"]}]},{"id":"d","pts":2,"topic":"Funktionale Zusammenhänge","type":"self","q":"Lena fährt eine andere Tour. Die Strecke, die sie noch fahren muss, wird durch die Funktion g mit g(x) = −9x + 45 beschrieben.<br>Begründe anhand der Funktionsgleichungen von f und g, dass Tom pro Stunde eine größere Strecke fährt als Lena.","sol":"<p>1 P: Der Wert vor x gibt an, wie viele km pro Stunde sich die Reststrecke verringert: bei f sind das 12 km pro Stunde, bei g 9 km pro Stunde.<\/p><p>1 P: Da 12 &gt; 9 ist, fährt Tom pro Stunde 3 km weiter als Lena.<\/p><p class=\"ans\">Tom fährt 12 km pro Stunde, Lena nur 9 km pro Stunde.<\/p>"},{"id":"e","pts":4,"topic":"Funktionale Zusammenhänge","type":"num","q":"Am nächsten Wochenende fahren Tom und Lena jeweils eine neue Tour. Beide fahren genauso schnell wie vorher.<br>Bestimme die Strecke (in km), die beide zusammen in 3 Stunden zurücklegen.","sol":"<p>2 P: Tom: 3 · 12 km = 36 km.<\/p> 88"]}]},{"id":"b","pts":3,"topic":"Flächen, Kreise und Pythagoras","type":"num","q":"Berechne den Flächeninhalt des halbkreisförmigen Teils in m² (gerundet auf zwei Nachkommastellen).","sol":"<p>1 P: Radius r = 1,2 m : 2 = 0,6 m.<\/p><p>2 P: A = {1/2} · π · r<sup>2<\/sup> = {1/2} · π · 0,6<sup>2<\/sup> ≈ 0,5655 m² ≈ 0,57 m².<\/p><p class=\"ans\">A ≈ 0,57 m²<\/p>","fields":[{"label":"A =","unit":"m²","answer":"0,57","tol":0.005,"alt":["0.57","0,5655"]}]},{"id":"c","pts":3,"topic":"Flächen, Kreise und Pythagoras","type":"num","q":"Das Hochbeet wird rundherum mit Randbrettern eingefasst (die gepunktete Linie zwischen Rechteck und Halbkreis bekommt kein Brett). Berechne die Gesamtlänge der Randbretter in m (gerundet auf eine Nachkommastelle).","sol":"<p>1 P: gerade Seiten: 2,4 + 2,4 + 1,2 = 6 m.<\/p><p>1 P: Halbkreisbogen: {1/2} · π · 1,2 ≈ 1,885 m.<\/p><p>1 P: Summe: 6 m + 1,885 m ≈ 7,9 m.<\/p><p class=\"ans\">Es werden etwa 7,9 m Randbretter benötigt.<\/p>","fields":[{"label":"Länge =","unit":"m","answer":"7,9","tol":0.05,"alt":["7.9","7,885"]}]},{"id":"d","pts":4,"topic":"Flächen, Kreise und Pythagoras","type":"num","q":"Das Hochbeet wird 0,8 m hoch mit Erde gefüllt.<br>Berechne das Volumen der Erde in m³ (gerundet auf zwei Nachkommastellen).<br>Erde gibt es in Säcken zu je 50 Litern. Berechne, wie viele Säcke mindestens gekauft werden müssen.","sol":"<p>1 P: Gesamte Grundfläche: 2,88 m² + 0,57 m² = 3,45 m².<\/p><p>1 P: V = 3,45 m² · 0,8 m ≈ 2,76 m³.<\/p><p>1 P: 2,76 m³ = 2760 Liter.<\/p><p>1 P: 2760 : 50 = 55,2, also müssen 56 Säcke gekauft werden.<\/p><p class=\"ans\">V ≈ 2,76 m³; 56 Säcke<\/p>","fields":[{"label":"Volumen =","unit":"m³","answer":"2,76","tol":0.01,"alt":["2.76"]},{"label":"Säcke =","unit":"","answer":"56","tol":0,"alt":["56"]}]},{"id":"e","pts":4,"topic":"Flächen, Kreise und Pythagoras","type":"self","q":"Über den rechteckigen Teil wird eine Schnur diagonal gespannt (gestrichelte Linie in der Abbildung).<br>Skizziere ein geeignetes Dreieck, beschrifte es mit den Längen und berechne die Länge der Schnur (gerundet auf zwei Nachkommastellen).","sol":"<p>2 P: Rechtwinkliges Dreieck mit den Katheten 2,4 m und 1,2 m; die Schnur ist die Hypotenuse d.<\/p><p>1 P: d<sup>2<\/sup> = 2,4<sup>2<\/sup> + 1,2<sup>2<\/sup> = 5,76 + 1,44 = 7,2.<\/p><p>1 P: d = √7,2 ≈ 2,68 m.<\/p><p class=\"ans\">Die Schnur ist etwa 2,68 m lang.<\/p>"}]}]}},"g2":{"id":"g2","titel":"Prüfung 2","stil":"orientiert an der ZAP 2025","teil1":{"aufgaben":[{"id":"1","titel":"Kreuze jeweils das richtige Ergebnis an.","parts":[{"id":"a","pts":1,"topic":"Rechnen in verschiedenen Zahlbereichen II","type":"mc","q":"{2/3} + {1/6} =","options":["{3/9}","{5/6}","{1/2}","{3/18}"],"correct":1,"sol":"<p>Gleichnamig machen: {2/3} = {4/6}. Dann {4/6} + {1/6} = {5/6}.<\/p><p class=\"ans\">{2/3} + {1/6} = {5/6}<\/p>"},{"id":"b","pts":1,"topic":"Rechnen in verschiedenen Zahlbereichen I","type":"mc","q":"7 · 6 − 3 · 8 =","options":["18","66","312","24"],"correct":0,"sol":"<p>Punkt vor Strich: 7 · 6 = 42 und 3 · 8 = 24. Dann 42 − 24 = 18.<\/p><p class=\"ans\">7 · 6 − 3 · 8 = 18<\/p>"},{"id":"c","pts":1,"topic":"Prozentrechnung","type":"mc","q":"25 % entsprechen 60 €. Der Grundwert beträgt","options":["15 €","85 €","240 €","150 €"],"correct":2,"sol":"<p>25 % = {1/4}. Also ist der Grundwert 4 · 60 € = 240 €.<\/p><p class=\"ans\">Der Grundwert beträgt 240 €.<\/p>"},{"id":"d","pts":1,"topic":"Lösen von Gleichungen","type":"mc","q":"2a² = 50","options":["a = 25","a = 12,5","a = 10","a = 5"],"correct":3,"sol":"<p>2a² = 50 | : 2 ergibt a² = 25. Wegen 5 · 5 = 25 ist a = 5.<\/p><p class=\"ans\">a = 5<\/p>"},{"id":"e","pts":1,"topic":"Mit Größen rechnen","type":"mc","q":"3,4 kg =","options":["34 g","340 g","3&nbsp;400 g","34&nbsp;000 g"],"correct":2,"sol":"<p>1 kg = 1&nbsp;000 g, also 3,4 kg = 3,4 · 1&nbsp;000 g = 3&nbsp;400 g.<\/p><p class=\"ans\">3,4 kg = 3&nbsp;400 g<\/p>"},{"id":"f","pts":1,"topic":"Rechnen in verschiedenen Zahlbereichen II","type":"mc","q":"Die Dezimalzahl 0,25 entspricht dem Bruch","options":["{1/25}","{1/4}","{2/5}","{1/2}"],"correct":1,"sol":"<p>0,25 = {25/100} = {1/4} (Kürzen mit 25).<\/p><p class=\"ans\">0,25 = {1/4}<\/p>"}]},{"id":"2","titel":"Berechne.","parts":[{"id":"a","pts":1,"topic":"Mit Größen rechnen","type":"num","q":"6 km − 250 m = ____ m","fields":[{"label":"","unit":"m","answer":"5750","alt":["5 750","5.750"],"tol":0}],"sol":"<p>6 km = 6&nbsp;000 m; 6&nbsp;000 m − 250 m = 5&nbsp;750 m.<\/p><p class=\"ans\">5&nbsp;750 m<\/p>"},{"id":"b","pts":1,"topic":"Mit Größen rechnen","type":"num","q":"3 {1/2} h = ____ min","fields":[{"label":"","unit":"min","answer":"210","alt":[],"tol":0}],"sol":"<p>3 h = 180 min und {1/2} h = 30 min. 180 min + 30 min = 210 min.<\/p><p class=\"ans\">210 min<\/p>"}]},{"id":"3","titel":"Berechne.","intro":"<p>Auf dem Grundriss eines Schulgebäudes im Maßstab 1 : 200 ist ein Klassenraum 3,5 cm breit.<\/p><p>Berechne, wie breit der Klassenraum in Wirklichkeit ist.<\/p>","parts":[{"id":"a","pts":2,"topic":"Dreisatz und Maßstab","type":"num","q":"Breite in Wirklichkeit:","fields":[{"label":"","unit":"m","answer":"7","alt":["7,0"],"tol":0}],"sol":"<p>3,5 cm · 200 = 700 cm (1 P).<\/p><p>700 cm = 7 m (1 P).<\/p><p class=\"ans\">Der Klassenraum ist 7 m breit.<\/p>"}]},{"id":"4","titel":"Ermittle.","intro":"<p>Fünf Kinder haben im letzten Monat Bücher gelesen.<\/p><table class=\"tab\"><tr><th>Kind<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>E<\/th><\/tr><tr><td>Anzahl der Bücher<\/td><td>7<\/td><td>3<\/td><td>9<\/td><td>4<\/td><td>2<\/td><\/tr><\/table>","parts":[{"id":"a","pts":1,"topic":"Statistische Kennwerte","type":"num","q":"Ermittle den Zentralwert (Median).","fields":[{"label":"Median:","unit":"Bücher","answer":"4","alt":[],"tol":0}],"sol":"<p>Geordnet: 2, 3, 4, 7, 9. Der mittlere Wert ist 4.<\/p><p class=\"ans\">Median: 4 Bücher<\/p>"},{"id":"b","pts":1,"topic":"Statistische Kennwerte","type":"num","q":"Berechne den Durchschnitt (arithmetisches Mittel).","fields":[{"label":"Mittelwert:","unit":"Bücher","answer":"5","alt":[],"tol":0}],"sol":"<p>Summe: 7 + 3 + 9 + 4 + 2 = 25. Durchschnitt: 25 : 5 = 5.<\/p><p class=\"ans\">Durchschnitt: 5 Bücher<\/p>"}]},{"id":"5","titel":"Berechne.","intro":"<p>Ein Lastenaufzug darf höchstens 1,2 t tragen. Auf den Aufzug werden drei Kisten gestellt: 450 kg, 0,35 t und 380 kg.<\/p>","parts":[{"id":"a","pts":1,"topic":"Mit Größen rechnen","type":"num","q":"Berechne, wie viel kg noch dazugeladen werden dürfen.","fields":[{"label":"","unit":"kg","answer":"20","alt":[],"tol":0}],"sol":"<p>1,2 t = 1&nbsp;200 kg; 0,35 t = 350 kg.<\/p><p>450 kg + 350 kg + 380 kg = 1&nbsp;180 kg. 1&nbsp;200 kg − 1&nbsp;180 kg = 20 kg.<\/p><p class=\"ans\">Es dürfen noch 20 kg dazugeladen werden.<\/p>"}]},{"id":"6","titel":"Berechne.","intro":"<p>Der Schulkiosk hat 120 Brötchen eingekauft. Bis zur großen Pause werden 60 % davon verkauft.<\/p>","parts":[{"id":"a","pts":1,"topic":"Prozentrechnung","type":"num","q":"Berechne, wie viele Brötchen bis zur großen Pause verkauft wurden.","fields":[{"label":"","unit":"Brötchen","answer":"72","alt":[],"tol":0}],"sol":"<p>10 % von 120 sind 12. Also sind 60 % gleich 6 · 12 = 72.<\/p><p class=\"ans\">Es wurden 72 Brötchen verkauft.<\/p>"},{"id":"b","pts":1,"topic":"Prozentrechnung","type":"num","q":"Nach der großen Pause werden noch 24 Brötchen verkauft. Berechne, wie viel Prozent der eingekauften Brötchen das sind.","fields":[{"label":"","unit":"%","answer":"20","alt":[],"tol":0}],"sol":"<p>10 % von 120 sind 12, also sind 24 Brötchen 20 %. (Oder: 24 : 120 = {1/5} = 20 %.)<\/p><p class=\"ans\">24 Brötchen sind 20 % der eingekauften Brötchen.<\/p>"}]},{"id":"7","titel":"Löse die Gleichung 6x − 5 = 25 − 4x.","parts":[{"id":"a","pts":2,"topic":"Lösen von Gleichungen","type":"num","q":"6x − 5 = 25 − 4x","fields":[{"label":"x =","unit":"","answer":"3","alt":[],"tol":0}],"sol":"<p>6x − 5 = 25 − 4x | + 4x ergibt 10x − 5 = 25 (1 P).<\/p><p>| + 5 ergibt 10x = 30; | : 10 ergibt x = 3 (1 P).<\/p><p>Probe: 6 · 3 − 5 = 13 und 25 − 4 · 3 = 13.<\/p><p class=\"ans\">x = 3<\/p>"}]},{"id":"8","titel":"Stelle eine Funktionsgleichung auf.","intro":"<p>Ein Fotodienst druckt Fotos nach folgendem Tarif:<\/p><table class=\"tab\"><tr><th>FotoFix<\/th><\/tr><tr><td>Grundpreis: 3 €,<br>0,20 € pro Foto<\/td><\/tr><\/table><p>f(x) steht dabei für die Kosten in Euro, x steht für die Anzahl der Fotos.<\/p>","parts":[{"id":"a","pts":2,"topic":"Lineare Funktionen und Zuordnungen","type":"self","q":"Stelle für den Tarif FotoFix eine Funktionsgleichung auf.","sol":"<p>Der Preis pro Foto (0,20 €) ist die Steigung (1 P), der Grundpreis (3 €) ist der y-Achsenabschnitt (1 P).<\/p><p class=\"ans\">f(x) = 0,2x + 3 (oder f(x) = 0,20 · x + 3)<\/p>"}]},{"id":"9","titel":"Zeichne das Dreieck.","intro":"<p>Ein Dreieck ABC hat folgende Eigenschaften:<\/p><p>c = 6 cm, α = 40°, β = 70°<\/p>","parts":[{"id":"a","pts":2,"topic":"Konstruieren: Winkel, Dreiecke und Vierecke","type":"self","q":"Zeichne das Dreieck auf Papier.","sol":"<p>Zeichne die Seite c = AB = 6 cm. Trage in A den Winkel 40° und in B den Winkel 70° an. Der Schnittpunkt der freien Schenkel ist C. Kontrolle: γ = 180° − 40° − 70° = 70°.<\/p><p>1 P für Seite c = 6 cm, 1 P für beide Winkel (im Rahmen der Zeichengenauigkeit).<\/p>"}]},{"id":"10","titel":"Gib an.","intro":"<p>Der Körper wurde aus kleinen Würfeln mit einer Kantenlänge von 1 cm ohne Lücken gebaut.<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZgAAAGjCAYAAAARhgM7AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAkNhJREFUeJzs3XVAlff7//HnoUNU7EaxEAVEui1AwQQ7EVunM7c5Z6zLbepmzM2uKSKIioCA0iEI2N2NQZcCvz+Onn32/S0M4Cbej7/Ge8C58HDOi/u+3/d1yUpLS0sRBEEQhDKmJHUBgiAIQvUkAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQhHIhAkYQBEEoFyJgBEEQh ,{"id":"11","titel":"Kreuze an.","intro":"<p>Die Tabelle zeigt die Einkaufsliste für ein Schulfest. Der Gesamtpreis ist jeweils Anzahl mal Preis pro Stück.<\/p><table class=\"tab\"><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><\/tr><tr><th>1<\/th><td>Artikel<\/td><td>Anzahl<\/td><td>Preis pro Stück in €<\/td><td>Gesamtpreis in €<\/td><\/tr><tr><th>2<\/th><td>Würstchen<\/td><td>40<\/td><td>0,80<\/td><td>32<\/td><\/tr><tr><th>3<\/th><td>Brötchen<\/td><td>40<\/td><td>0,25<\/td><td>&nbsp;<\/td><\/tr><tr><th>4<\/th><td>Limonade<\/td><td>30<\/td><td>1,20<\/td><td>36<\/td><\/tr><\/table><p>In die Zelle D3 soll der Gesamtpreis für die Brötchen berechnet werden.<\/p>","parts":[{"id":"a","pts":1,"topic":"Tabellenkalkulation","type":"mc","q":"Welcher Befehl muss in Zelle D3 stehen?","options":["= B3 + C3","= B2 * C2","= B3 * C3","= D2 * D4"],"correct":2,"sol":"<p>Gesamtpreis = Anzahl · Preis pro Stück. Die Anzahl steht in B3, der Preis in C3. In der Tabellenkalkulation schreibt man = B3 * C3 (Ergebnis: 10 €).<\/p><p class=\"ans\">= B3 * C3<\/p>"}]}]},"teil2":{"pflicht":[{"id":"1","titel":"Kinogutscheine","themaA":"Stochastik: Wahrscheinlichkeit und Zufall","intro":"<p>Ein Kino verlost bei einer Aktion Lose. Jedes Los gewinnt mit einer Wahrscheinlichkeit von {1/8} einen Kinogutschein. Alle Lose werden unabhängig voneinander betrachtet.<\/p>","parts":[{"id":"a","pts":2,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"num","q":"Mia kauft ein Los. Gib die Wahrscheinlichkeit, dass sie einen Gutschein gewinnt, als Prozentsatz und als Dezimalzahl an.","fields":[{"label":"Prozentsatz:","unit":"%","answer":"12,5","alt":["12.5"],"tol":0},{"label":"Dezimalzahl:","unit":"","answer":"0,125","alt":["0.125"],"tol":0}],"sol":"<p>{1/8} = 1 : 8 = 0,125 (1 P).<\/p><p>0,125 = 12,5 % (1 P).<\/p><p class=\"ans\">Mia gewinnt mit 12,5 % = 0,125.<\/p>"},{"id":"b","pts":2,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Gib die Wahrscheinlichkeit an, dass Mias Los nicht gewinnt. Schreibe die Wahrscheinlichkeit als Bruch und als Prozentsatz auf.","sol":"<p>Gegenereignis: P(kein Gewinn) = 1 − {1/8} = {7/8} (1 P).<\/p><p>{7/8} = 0,875 = 87,5 % (1 P).<\/p><p class=\"ans\">Mit {7/8} = 87,5 % gewinnt Mias Los nicht.<\/p>"},{"id":"c","pts":5,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Mia und ihr Bruder Ben kaufen jeweils ein Los.<ul><li>Zeichne dazu ein vollständiges Baumdiagramm. Bezeichne Mias Los mit M und Bens Los mit B (G = Gewinn, N = Niete).<\/li><li>Berechne die Wahrscheinlichkeit, dass genau eines der beiden Lose gewinnt.<\/li><\/ul>","sol":"<p><b>Baumdiagramm<\/b> (3 P): Erste Stufe (Mia): G mit {1/8}, N mit {7/8}. Zweite Stufe (Ben): von jedem Ast wieder G mit {1/8} und N mit {7/8}. Es gibt vier Pfade: GG, GN, NG, NN (1 P für die Struktur, 1 P für die Beschriftung der Äste mit Wahrscheinlichkeiten, 1 P für die vier Pfade).<\/p><p><b>Rechnung<\/b> (2 P): Genau ein Los gewinnt bei den Pfaden GN und NG.<\/p><p>P(GN) = {1/8} · {7/8} = {7/64}; P(NG) = {7/8} · {1/8} = {7/64} (1 P).<\/p><p>P(genau ein Gewinn) = {7/64} + {7/64} = {14/64} = {7/32} ≈ 0,219 = 21,9 % (1 P).<\/p><p class=\"ans\">Mit etwa 21,9 % gewinnt genau eines der beiden Lose.<\/p>"},{"id":"d","pts":3,"topic":"Rechnen in Sachsituationen","type":"self","q":"Das Kino verkauft 160 Lose zu je 2 €. Jeder Gutschein hat für das Kino einen Wert von 12 €.<ul><li>Begründe rechnerisch, warum das Kino davon ausgeht, dass 20 der 160 Lose gewinnen.<\/li><li>Berechne, welchen Gewinn das Kino macht, wenn genau 20 Lose gewinnen.<\/li><\/ul>","sol":"<p>{1/8} von 160 Losen: 160 : 8 = 20 (1 P).<\/p><p>Einnahmen: 160 · 2 € = 320 € (0,5 P). Kosten: 20 · 12 € = 240 € (0,5 P).<\/p><p>Gewinn: 320 € − 240 € = 80 € (1 P).<\/p><p class=\"ans\">Das Kino macht 80 € Gewinn.<\/p>"},{"id":"e","pts":4,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Jeder Gutschein hat einen vierstelligen Code. Der Code besteht aus zwei Ziffern 4, einer 0 und einer 9 (zum Beispiel 4 0 9 4).<br>Schreibe alle 12 möglichen Codes auf.","sol":"<p>Man legt zuerst fest, wo die 0 und die 9 stehen (4 · 3 = 12 Möglichkeiten); auf den übrigen Plätzen stehen die beiden 4en. Es gibt 12 Codes:<\/p><p>4409, 4490, 4049, 4094, 4904, 4940, 0449, 0494, 0944, 9044, 9404, 9440<\/p><p>Punkte: 4 P für alle 12 Codes ohne Wiederholung; 3 P für 9–11 richtige; 2 P für 6–8 richtige; 1 P für 3–5 richtige.<\/p>"}]},{"id":"2","titel":"Skateboard-Verleih","themaA":"Funktionale Zusammenhänge","intro":"<p>Der Verleih „RollOn“ vermietet Skateboards. Man zahlt eine Grundgebühr von 6 € und zusätzlich 3 € pro Stunde.<\/p><p>Die Kosten in Euro können mit der Funktion f mit f(x) = 3x + 6 berechnet werden. Dabei ist x die Leihzeit in Stunden.<\/p>","parts":[{"id":"a","pts":3,"topic":"Funktionale Zusammenhänge","type":"num","q":"Vervollständige die Tabelle.<table class=\"tab\"><tr><th>Leihzeit x in Stunden<\/th><td>0<\/td><td>2<\/td><td>4<\/td><td>&nbsp;<\/td><td>10<\/td><\/tr><tr><th>Kosten in €<\/th><td>6<\/td><td>12<\/td><td>&nbsp;<\/td><td>24<\/td><td>&nbsp;<\/td><\/tr><\/table>","fields":[{"label":"Kosten bei x = 4:","unit":"€","answer":"18","alt":[],"tol":0},{"label":"Leihzeit bei 24 €:","unit":"h","answer":"6","alt":[],"tol":0},{"label":"Kosten bei x = 10:","unit":"€","answer":"36","alt":[],"tol":0}],"sol":"<p>f(4) = 3 · 4 + 6 = 18 (1 P).<\/p><p>3x + 6 = 24 | − 6 ergibt 3x = 18, also x = 6 (1 P).<\/p><p>f(10) = 3 · 10 + 6 = 36 (1 P).<\/p><p class=\"ans\">Tabelle: bei 4 h → 18 €; bei 24 € → 6 h; bei 10 h → 36 €.<\/p>"},{"id":"b","pts":4,"topic":"Funktionale Zusammenhänge","type":"num","q":"Tom hat 48 € dabei. Berechne, wie viele Stunden er ein Skateboard höchstens leihen kann.","fields":[{"label":"Leihzeit:","unit":"h","answer":"14","alt":[],"tol":0}],"sol":"<p>Gleichung aufstellen: 3x + 6 = 48 (1 P).<\/p><p>| − 6 ergibt 3x = 42 (1 P); | : 3 ergibt x = 14 (1 P).<\/p><p>Probe: 3 · 14 + 6 = 48.<\/p><p class=\"ans\">Tom kann das Skateboard 14 Stunden leihen. (1 P für Antwortsatz)<\/p>"},{"id":"c","pts":5,"topic":"Funktionale Zusammenhänge","type":"num","q":"Ein zweiter Verleih verlangt keine Grundgebühr, aber 4,50 € pro Stunde. Seine Kosten kann man mit g(x) = 4,5x berechnen.<br>Berechne, nach wie vielen Stunden beide Verleihe gleich viel kosten, und gib an, wie viel Euro das dann sind.","fields":[{"label":"Leihzeit:","unit":"h","answer":"4","alt":[],"tol":0},{"label":"Kosten:","unit":"€","answer":"18","alt":[],"tol":0}],"sol":"<p>Gleichsetzen: 3x + 6 = 4,5x (2 P).<\/p><p>| − 3x ergibt 6 = 1,5x; | : 1,5 ergibt x = 4 (2 P).<\/p><p>Kosten: g(4) = 4,5 · 4 = 18 und f(4) = 3 · 4 + 6 = 18 (1 P).<\/p><p class=\"ans\">Nach 4 Stunden kosten beide Verleihe gleich viel, nämlich 18 €.<\/p>"},{"id":"d","pts":4,"topic":"Funktionale Zusammenhänge","type":"self","q":"Ein dritter Verleih hat den Tarif h. Das Schaubild zeigt seine Kosten in Abhängigkeit von der Leihzeit.<br><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAngAAAIKCAYAAACwfTLwAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAfU9JREFUeJzt3XdYFHf3NvCb6gLLgiBKU7GCgl2x94JdEXuLii2JErtJNDF5YhJ71Nh7b4AdG3bsLVbs2BCxoFSpu/P+4Su/ENgVcQsz3J/ryvU8mTk7c45r5HZ25ztGgiAIICIiIiLJMDZ0A0RERESkXQx4RERERBLDgEdEREQkMQx4RERERBLDgEdEREQkMQx4RERERBLDgEdEREQkMQx4RERERBLDgEdEREQkMQx4RERERBLDgEdEREQkMQx4RERERBLDgEdEREQkMQx4RERERBLDgEdEREQkMaaGbkAbbt68ifPnzyM9PR3e3t6oXr16jnUJCQk4ffo0Hj58mFlnYmKi526JiIiIdEvUAU+pVGLQoEFYt24dZDIZ5HI53rx5g6+++gqrV6+GkZFRZu3NmzfRunVrREVFwd7eHm/evEH79u2xbds2WFhYGHAKIiIiIu0S9Ue0s2fPxqZNm7B69WrExMTg9evXWLFiBdauXYs1a9Zk1qWlpcHHxwdFihTB8+fP8fr1a4SGhuLIkSMYM2aM4QYgIiIi0gFRB7z4+HiMGzcOAwYMgKWlJQDA398fJUqUwNGjRzPrAgMDERUVhfXr18PJyQkA0KJFC0ycOBHr1q1DbGysIdonIiIi0glRB7ypU6fizz//zLItOTkZ7969Q+HChTO3hYSEwMPDA5UqVcpS26NHD7x//x7Hjx/P1fkUCoXaf4yNjeHi4vLFMxERERF9KVF/B++jjIwMREZGIjIyElOnTkWRIkUQEBCQuT8yMhLlypXL9rqyZcvCyMgIz549++IeBEFAbFw8Ltx8/MXHIiIiooLB28tNJ8eVRMB7+PAhPDw8AAB2dnYICQlB2bJlM/dHRUVl+fePTE1N  der waagerechten Achse, Kosten in Euro von 0 bis 30 auf der senkrechten Achse. Die Gerade beginnt bei 8 Euro und verläuft über die Punkte 4 Stunden, 16 Euro und 8 Stunden, 24 Euro.\" class=\"fig\"><br>Gib eine Funktionsgleichung h(x) an.","sol":"<p>Ablesen: Bei x = 0 beginnt die Gerade bei 8 €, der y-Achsenabschnitt ist 8 (1 P).<\/p><p>Steigung: von (0 | 8) nach (4 | 16): Anstieg 8 € auf 4 Stunden, also m = 8 : 4 = 2 (2 P).<\/p><p>Gleichung (1 P).<\/p><p class=\"ans\">h(x) = 2x + 8<\/p>"}]}],"wahl":[{"id":"3","titel":"Sandkasten","themaA":"Flächen, Kreise und Pythagoras","intro":"<p>Auf einem Spielplatz gibt es einen kreisförmigen Sandkasten mit einem Radius von 1,5 m.<\/p>","parts":[{"id":"a","pts":2,"topic":"Flächen, Kreise und Pythagoras","type":"num","q":"Berechne den Flächeninhalt des Sandkastens. Runde auf zwei Nachkommastellen.","fields":[{"label":"A =","unit":"m²","answer":"7,07","alt":["7.07"],"tol":0.01}],"sol":"<p>A = π · r² = π · (1,5 m)² (1 P)<\/p><p>A = π · 2,25 m² ≈ 7,07 m² (1 P)<\/p><p class=\"ans\">Der Sandkasten hat einen Flächeninhalt von etwa 7,07 m².<\/p>"},{"id":"b","pts":3,"topic":"Flächen, Kreise und Pythagoras","type":"num","q":"Um den Sandkasten soll ein Rand aus Holzleisten gelegt werden. Die Leisten sind jeweils 2,50 m lang.<ul><li>Berechne den Umfang des Sandkastens in m.<\/li><li>Gib an, wie viele Leisten mindestens gekauft werden müssen.<\/li><\/ul>","fields":[{"label":"Umfang:","unit":"m","answer":"9,42","alt":["9.42"],"tol":0.01},{"label":"Leisten:","unit":"","answer":"4","alt":[],"tol":0}],"sol":"<p>u = 2 · π · r = 2 · π · 1,5 m ≈ 9,42 m (2 P).<\/p><p>9,42 m : 2,50 m ≈ 3,77, also braucht man 4 Leisten (1 P).<\/p><p class=\"ans\">Der Umfang beträgt etwa 9,42 m; es müssen mindestens 4 Leisten gekauft werden.<\/p>"},{"id":"c","pts":4,"topic":"Flächen, Kreise und Pythagoras","type":"num","q":"Der Sandkasten wird im Winter mit einer quadratischen Plane abgedeckt (Abb. 1, Draufsicht). Die Seitenlänge der Plane ist so groß wie der Durchme n f und g mit Schnittpunkt S(4 | 1)\" class=\"fig\">"},{"id":"b","pts":1,"topic":"Lineare Funktionen und Zuordnungen","type":"num","q":"Gib die Koordinaten des Schnittpunktes der beiden Graphen an.","sol":"Aus der Zeichnung: Die Graphen schneiden sich bei x = 4, y = 1. Probe: f(4) = 0,5 · 4 – 1 = 1 und g(4) = – 4 + 5 = 1.<p class=\"ans\">S(4 | 1)<\/p>","fields":[{"label":"x =","unit":"","answer":"4","tol":0},{"label":"y =","unit":"","answer":"1","tol":0}]}]}]},"teil2":{"pflicht":[{"id":"A1","titel":"Eisdiele","themaA":"Stochastik: Wahrscheinlichkeit und Zufall","intro":"<p>Die Eisdiele „Eisberg“ macht eine Aktion. Wer ein Eis kauft, zieht ohne hinzusehen ein Kärtchen aus einer Dose. Auf den Kärtchen steht „Gratis-Eis“ (GE), „Extra-Kugel“ (EK) oder „Danke“ (D). Gezogene Kärtchen werden nicht zurückgelegt.<\/p><p>Am Montag befinden sich 20 Kärtchen in der Dose: 1 Gratis-Eis, 4 Extra-Kugel und 15 Danke.<\/p>","parts":[{"id":"a","pts":3,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Eine Kundin zieht ein Kärtchen.<ul><li>Gib die Wahrscheinlichkeit dafür an, eine Extra-Kugel zu ziehen.<\/li><li>Gib die Wahrscheinlichkeit als Bruch, als Dezimalzahl und als Prozentzahl an.<\/li><\/ul>","sol":"4 von 20 Kärtchen sind „Extra-Kugel“: P = {4/20} (1 P). Gekürzt {1/5} (1 P) = 0,2 = 20 % (1 P).<p class=\"ans\">P(Extra-Kugel) = {1/5} = 0,2 = 20 %<\/p>"},{"id":"b","pts":4,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Am Montag ziehen nacheinander zwei Kunden je ein Kärtchen (die Dose ist anfangs wieder wie oben gefüllt).<br>Berechne die Wahrscheinlichkeit dafür, dass beide Kunden eine Extra-Kugel ziehen.","sol":"1. Zug: P(EK) = {4/20} (1 P). 2. Zug: Es sind nur noch 19 Kärtchen, davon 3 „Extra-Kugel“: P(EK) = {3/19} (1 P).<br>Pfadregel: {4/20} · {3/19} = {12/380} = {3/95} (2 P) ≈ 0,032.<p class=\"ans\">Die Wahrscheinlichkeit beträgt {3/95} ≈ 3,2 %.<\/p>"},{"id":"c","pts":5,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Am Dienstag befinden sich nur noch 10 Kärtchen in der Dose: 2 Gratis-Eis und 8 Danke (keine Extra-Kugel). Es werden nacheinander 2 Kärtchen gezogen.<br>Berechne die Wahrscheinlichkeit dafür, dass mindestens ein Gratis-Eis gezogen wird.","sol":"Möglichkeit 1 (alle Pfade): P(GE, GE) = {2/10} · {1/9} = {2/90}; P(GE, D) = {2/10} · {8/9} = {16/90}; P(D, GE) = {8/10} · {2/9} = {16/90} (je 1 P, insgesamt 3 P). Summe: {2/90} + {16/90} + {16/90} = {34/90} = {17/45} (1 P) ≈ 0,378.<br>Möglichkeit 2 (Gegenereignis): P(zweimal Danke) = {8/10} · {7/9} = {56/90}; 1 – {56/90} = {34/90}.<p class=\"ans\">Die Wahrscheinlichkeit beträgt {17/45} ≈ 37,8 %.<\/p>"},{"id":"d","pts":4,"topic":"Stochastik: Wahrscheinlichkeit und Zufall","type":"self","q":"Am Mittwoch befinden sich 10 Kärtchen in der Dose: 1 Gratis-Eis, 1 Extra-Kugel und 8 Danke. Es werden nacheinander 2 Kärtchen gezogen.<ul><li>Zeichne ein Baumdiagramm (ohne Wahrscheinlichkeiten), aus dem man alle möglichen Kombinationen ablesen kann. Die Reihenfolge muss beachtet werden. Verwende die Abkürzungen GE, EK und D.<\/li><li>Gib an, wie viele Pfade es gibt.<\/li><\/ul>","sol":"Erste Stufe: GE, EK, D (1 P). Zweite Stufe: nach GE nur EK oder D; nach EK nur GE oder D; nach D alle drei: GE, EK, D (2 P).<br><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuwAAAJCCAYAAACbNpJiAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAeWNJREFUeJzt3Xd4VGX6xvF7Sia9V0KH0INS7N1V19577wK/VRR7QQiI3RXFAthYu2tbe1m7rl1ASGgm9Jbe62TK748JQ4YJJZDJmUy+n+vi2uR9JycPKyQ3T97zHJPb7XYLAAAAQFAyG10AAAAAgO0jsAMAAABBjMAOAAAABDECOwAAABDECOwAAABAECOwAwAAAEGMwA4AAAAEMQI7AAAAEMQI7AAAAEAQI7ADAAAAQYzADgAAAAQxAjsAAAAQxAjsAAAAQBAjsAMAAABBjMAOAAAABDECOwAAABDECOwAAABAECOwAwAAAEGMwA4AAAAEMQI7AAAAEMQI7AAAAEAQI7ADAAAAQYzADgAAAAQxAjsAAAAQxAjsAAAAQBAjsAMAAABBjMAOAAAABDECOwAAABDECOwAAABAECOwAwAAAEGMwA4AAAAEMQI7AAAAEMQI7AAAAEAQI7ADAAAAQYzADgAAAAQxAjsAAAAQxAjsAAAAQBAjsAMAAABBzGp0AQAQKC6XS2WVNZKk1KR4g const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(h){return String(h||'').replace(/\{([^{}\/]+)\/([^{}\/]+)\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>').replace(/<table class="tab">([\s\S]*?)<\/table>/g,'<div class="tw"><table class="tab">$1</table></div>')}
function qpts(p){return `<span class="ppt">(${p} ${p===1?'Punkt':'Punkte'})</span>`}
function mmss(ms){const neg=ms<0;ms=Math.abs(ms);const s=Math.ceil(ms/1000);const m=Math.floor(s/60);return (neg?'+':'')+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
/* ---------- Zustand ---------- */
let S=load()||fresh();
function fresh(){return {stage:'home',exam:null,opts:{timer:true,pause:15},t1:{},t2:{},pauseEnd:0,ans:{},score:{},wahl:null}}
function load(){try{const r=JSON.parse(localStorage.getItem(LSK)||'null');return r&&r.stage?r:null}catch(e){return null}}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}},200)}
function hist(){try{return JSON.parse(localStorage.getItem(LSK+'_h')||'{}')}catch(e){return {}}}
function saveHist(id,pts){try{const h=hist();h[id]=pts;localStorage.setItem(LSK+'_h',JSON.stringify(h))}catch(e){}}
const ex=()=>EXAMS[S.exam];
/* ---------- Timer ---------- */
let tick=null,warned={};
function clockTarget(){return S.stage==='t1'?S.t1.deadline:S.stage==='t2'?S.t2.deadline:0}
function startTick(){stopTick();tick=setInterval(updClock,250);updClock()}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function updClock(){
  const el=$('#clock');if(!el)return;
  const dl=clockTarget();if(!dl){return}
  const left=dl-Date.now();
  el.textContent=S.hideClock&&S.stage!=='pause'?'••:••':mmss(left);
  el.classList.toggle('warn',left<=10*60000&&left>5*60000&&S.stage!=='pause');
  el.classList.toggle('danger',left<=5*60000&&S.stage!=='pause');
  if(S.stage!=='pause'){for(const m of [10,5,1]){if(left<=m*60000&&!warned[S.stage+m]){warned[S.stage+m]=1;if(left>0)$('#live').textContent='Noch '+m+(m===1?' Minute':' Minuten');}}
    const b=$('#timeup');if(b)b.hidden=left>0}
}
/* ---------- Rendering ---------- */
function render(){
  stopTick();
  const st=S.stage;
  $('#barwrap').innerHTML=bar();
  $('#app').innerHTML=st==='home'?home():st==='t1'?teil1():st==='pause'?pause():st==='t2'?teil2():st==='rate'?rateView():evalView();
  bind();
  if(clockTarget()&&S.opts.timer)startTick();
  if(st!=='home')window.scrollTo(0,0);
}
function bar(){
  if(S.stage==='home'||S.stage==='eval'||S.stage==='rate')return '';
  const e=ex();const timer=S.opts.timer;
  const lab=S.stage==='t1'?['Teil 1','Kurze Aufgaben · ohne Taschenrechner']:S.stage==='t2'?['Teil 2','Drei Aufgaben · Taschenrechner erlaubt']:['Pause','Teil 1 auswerten, dann Teil 2'];
  const chips=S.stage==='t1'?e.teil1.aufgaben.map(a=>`<a class="chip" href="#t1-${a.id}" data-chip="${a.id}">${a.id}</a>`).join(''):S.stage==='t2'?['1','2'].map(x=>`<a class="chip" href="#t2-${x}">Aufgabe ${x}</a>`).join('')+`<a class="chip" href="#t2-wahl">Wahlaufgabe</a>`:'';

/* ---------- Bewertung ---------- */
function num(s){
  s=String(s==null?'':s).replace(/[\u2212\u2013\u2014]/g,'-').replace(/\u00a0|\s/g,'').replace(/[°%€]|[a-zA-Zµ²³]+$/g,'');
  if(!s)return NaN;
  if(/^-?\d+\/\d+$/.test(s)){const [a,b]=s.split('/');return +a/+b}
  s=s.replace('−','-').replace(/(?<!^-?0)\.(?=\d{3}(\D|$))/g,'').replace(',','.');
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
function auto(key,p){
  const a=S.ans[key]||{};
  if(p.type==='mc'){return a.i==null?'leer':a.i===p.correct?'ok':'bad'}
  if(p.type==='num'){
    const f=a.f||[];if(!p.fields.some((_,i)=>String(f[i]||'').trim()))return 'leer';
    const ok=p.fields.every((fl,i)=>{const v=num(f[i]);if(isNaN(v))return false;const t=(fl.tol||0)+1e-9;return [fl.answer,...(fl.alt||[])].some(x=>Math.abs(num(x)-v)<=t)});
    return ok?'ok':'bad';
  }
  return 'self';
}

  [...e.teil2.pflicht,w].forEach(a=>a.parts.forEach(p=>out.push({t:2,a,p,key:`t2.${a.id}${p.id}`,topic:p.topic==='Körper'?'Körper (Teil 2)':p.topic})));
  return out;
}
function got(x){const r=auto(x.key,x.p);if(r!=='self')return r==='ok'?x.p.pts:0;const s=S.score[x.key];return s!=null?s:0}

}

function evalList(mode){

  $('#cy').focus();
}
function bind(){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  q('[data-start]',b=>b.onclick=()=>startExam(b.dataset.start));
  const ot=$('#o-timer');if(ot)ot.onchange=()=>{S.opts.timer=ot.checked;save()};
    const th=$('#hideclk');if(th)th.onclick=()=>{S.hideClock=!S.hideClock;th.textContent=S.hideClock?'Zeit zeigen':'Zeit ausblenden';th.setAttribute('aria-pressed',!!S.hideClock);updClock();save()};
  const doEnd1=()=>{const left=S.t1.deadline?S.t1.deadline-Date.now():0;if(S.opts.timer&&left>60000)confirmBar(`Teil 1 jetzt abgeben? Es bleiben noch ${mmss(left)} Minuten.`,'Ja, Teil 1 ist fertig',finish1);else finish1()};
  const e1=$('#end1');if(e1)e1.onclick=doEnd1;const e1b=$('#end1b');if(e1b)e1b.onclick=doEnd1;
  const doEnd2=()=>{const left=S.t2.deadline?S.t2.deadline-Date.now():0;if(S.opts.timer&&left>60000)confirmBar(`Prüfung jetzt abgeben? Es bleiben noch ${mmss(left)} Minuten.`,'Ja, abgeben',finish2);else finish2()};
  const e2=$('#end2');if(e2)e2.onclick=doEnd2;const e2b=$('#end2b');if(e2b)e2b.onclick=doEnd2;
  const g2=$('#go2');if(g2)g2.onclick=start2;const g2b=$('#go2b');if(g2b)g2b.onclick=start2;
  q('input[type=radio][data-k]',r=>r.onchange=()=>{(S.ans[r.dataset.k]=S.ans[r.dataset.k]||{}).i=+r.dataset.i;save()});
  q('input[type=text][data-k]',r=>r.oninput=()=>{const o=S.ans[r.dataset.k]=S.ans[r.dataset.k]||{};o.f=o.f||[];o.f[+r.dataset.f]=r.value;save()});
  q('[data-wahl]',b=>b.onclick=()=>{S.wahl=b.dataset.wahl;save();const y=window.scrollY;render();window.scrollTo(0,y)});
  q('[data-weval]',b=>b.onclick=()=>{S.wahlEval=b.dataset.weval;save();const y=window.scrollY;render();window.scrollTo(0,y)});
  q('[data-sc]',b=>b.onclick=()=>{S.score[b.dataset.sc]=+b.dataset.v;saveHist(S.exam,summary().total);save();const y=window.scrollY;render();window.scrollTo(0,y)});
  const g2c=$('#go2c');if(g2c)g2c.onclick=start2;const te=$('#toeval');if(te)te.onclick=toEval;const tr=$('#torate');if(tr)tr.onclick=()=>{S.stage='rate';save();render()};
  document.querySelectorAll('.again').forEach(ag=>ag.onclick=()=>{S=Object.assign(fresh(),{opts:S.opts});save();render()});
}
$('#th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
// Beim Neuladen mitten in der Prüfung: Zeiten laufen weiter (Frist ist absolut)
if(S.exam&&!EXAMS[S.exam])S=fresh();
render();
</script>
